<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<style>
  :root { --dl:#188038; --ll:#1a73e8; --wu:#9334e6; --pt:#e37400; --ink:#3c4043; --muted:#5f6368; --sel:#f9ab00; }
  html, body { margin:0; padding:0; background:#fff; font-family:"Source Sans Pro","Sarabun",sans-serif; color:var(--ink); }
  #wrap { position:relative; }
  svg { display:block; width:100%; user-select:none; }
  .hit { fill:rgba(0,0,0,0); cursor:pointer; }
  .hit:hover { fill:rgba(251,188,4,0.12); }
  .node { cursor:pointer; }
  .node:hover { filter:drop-shadow(0 0 3px var(--sel)); }
  .hint { font-size:12px; color:var(--muted); padding:2px 4px; }
  .pop { position:absolute; background:#fff; border:1px solid #dadce0; border-radius:10px;
         box-shadow:0 6px 24px rgba(0,0,0,.18); padding:10px 12px; font-size:13px; z-index:5;
         max-height:470px; overflow:auto; min-width:300px; }
  .pop h4 { margin:0 0 8px; font-size:14px; }
  .row { display:flex; gap:6px; align-items:center; margin:4px 0; flex-wrap:wrap; }
  .row label { min-width:54px; color:var(--muted); }
  input[type=number], input[type=text], select { width:70px; padding:3px 4px; border:1px solid #dadce0; border-radius:6px; font:inherit; }
  input[type=text] { width:90px; }
  table { border-collapse:collapse; margin-top:4px; }
  th, td { padding:2px 3px; font-size:12px; }
  th { color:var(--muted); font-weight:600; text-align:left; }
  td input[type=number] { width:56px; }
  td select { width:62px; }
  .btns { display:flex; gap:8px; justify-content:flex-end; margin-top:10px; }
  button { font:inherit; padding:4px 12px; border-radius:6px; border:1px solid #dadce0; background:#fff; cursor:pointer; }
  button.primary { background:#ff4b4b; color:#fff; border-color:#ff4b4b; }
  button.link { border:none; color:#1a73e8; padding:2px 4px; }
  button.del { border:none; color:#c5221f; padding:0 4px; }
  .item { border:1px solid #e8eaed; border-radius:8px; padding:6px 8px; margin:6px 0; background:#fafafa; }
  .item .row label { min-width:auto; }
  .item input[type=text] { width:74px; }
  .item input.nm { width:150px; }
  .item select.kind { width:190px; }
  .item .res { font-size:12px; color:var(--muted); margin-top:2px; }
  .item .res.err { color:#c5221f; }
  .pop.wide { min-width:560px; max-width:640px; }
</style>
</head>
<body>
<div id="wrap">
  <div class="hint">คลิกที่ช่วงคานเพื่อกรอกขนาดและน้ำหนัก • คลิกที่จุดรองรับเพื่อเปลี่ยนชนิดจุดรองรับ/ขนาดเสา</div>
  <svg id="svg" height="330"></svg>
</div>
<script>
const FRAME_H = 560;
let data = null, pop = null, selected = null;

function send(type, extra) {
  window.parent.postMessage(Object.assign({isStreamlitMessage: true, type: type}, extra || {}), "*");
}
function setValue(v) { send("streamlit:setComponentValue", {value: v, dataType: "json"}); }

window.addEventListener("message", (ev) => {
  if (!ev.data || ev.data.type !== "streamlit:render") return;
  data = ev.data.args.data;
  draw();
  send("streamlit:setFrameHeight", {height: FRAME_H});
});
send("streamlit:componentReady", {apiVersion: 1});

const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  (parent || svg).appendChild(e);
  return e;
}
const svg = document.getElementById("svg");
const num = (v) => (v === null || v === undefined || v === "" || Number.isNaN(Number(v))) ? null : Number(v);
const f2 = (v) => (Math.round((Number(v) || 0) * 100) / 100).toFixed(2);

function draw() {
  svg.innerHTML = "";
  if (!data || !data.spans.length) return;
  const W = svg.clientWidth || 900, padL = 30, padR = 30, yBeam = 205;
  const X0 = [0];
  data.spans.forEach(s => X0.push(X0[X0.length - 1] + Number(s.L)));
  const total = X0[X0.length - 1] || 1;
  const sx = (x) => padL + (W - padL - padR) * x / total;
  let wmax = 1e-9;
  data.spans.forEach(s => ["DL", "LL", "WU"].forEach(k => wmax = Math.max(wmax, Math.abs(num(s[k]) || 0))));
  data.extra.forEach(e => { if (e.kind !== "Point") wmax = Math.max(wmax, Math.abs(num(e.w1) || 0), Math.abs(num(e.w2) || 0)); });

  data.spans.forEach((s, i) => {
    const xa = sx(X0[i]), xb = sx(X0[i + 1]);
    if (selected && selected[0] === "span" && selected[1] === i + 1)
      el("rect", {x: xa, y: 6, width: xb - xa, height: 284, fill: "rgba(251,188,4,0.13)", stroke: "#f9ab00", "stroke-dasharray": "4 3"});
    let top = yBeam - 6;
    [["DL", "var(--dl)", "rgba(24,128,56,0.08)"], ["LL", "var(--ll)", "rgba(26,115,232,0.08)"],
     ["WU", "var(--wu)", "rgba(147,52,230,0.08)"]].forEach(([k, c, fill]) => {
      const w = num(s[k]) || 0;
      if (!w) return;
      const h = 18 + 40 * Math.abs(w) / wmax;
      el("rect", {x: xa, y: top - h, width: xb - xa, height: h, fill: fill, stroke: c, "stroke-width": 1.5});
      const n = Math.max(3, Math.round((xb - xa) / 28));
      for (let k2 = 0; k2 <= n; k2++) {
        const x = xa + (xb - xa) * k2 / n;
        el("line", {x1: x, y1: top - h, x2: x, y2: top - 2, stroke: c, "stroke-width": 1});
        el("path", {d: `M${x - 3},${top - 7} L${x},${top - 1} L${x + 3},${top - 7} Z`, fill: c});
      }
      el("text", {x: (xa + xb) / 2, y: top - h + 13, "text-anchor": "middle", "font-size": 12, fill: c, "font-weight": 600},
         null, `${k === "WU" ? "Wu" : k} = ${f2(w)} ${data.wu}`);
      top -= h + 3;
    });
    const stack = {};
    data.extra.filter(e => Number(e.span) === i + 1).forEach(e => {
      const c = e.case === "LL" ? "var(--ll)" : (e.case === "WU" ? "var(--wu)" : "var(--dl)");
      if (e.kind === "Point") {
        let a = num(e.a); if (a === null) a = s.L / 2;
        const x = sx(X0[i] + a), k = stack[a.toFixed(4)] || 0;
        stack[a.toFixed(4)] = k + 1;
        if (k === 0) {
          el("line", {x1: x, y1: top - 55, x2: x, y2: yBeam - 8, stroke: "var(--pt)", "stroke-width": 2.5});
          el("path", {d: `M${x - 5},${yBeam - 14} L${x},${yBeam - 5} L${x + 5},${yBeam - 14} Z`, fill: "var(--pt)"});
        }
        el("text", {x: x, y: Math.max(12, top - 60 - 13 * k), "text-anchor": "middle", "font-size": 11, fill: c, "font-weight": 600},
           null, `P${e.case === "WU" ? "u" : e.case} ${f2(e.w1)} ${data.fu}`);
      } else {
        const a = num(e.a) || 0; let b = num(e.b); if (b === null) b = s.L;
        const w1 = num(e.w1) || 0; let w2 = num(e.w2); if (w2 === null) w2 = w1;
        const ya = top - 40 * Math.abs(w1) / wmax, yb = top - 40 * Math.abs(w2) / wmax;
        const x1 = sx(X0[i] + a), x2 = sx(X0[i] + b), key = `d${a}-${b}`, k = stack[key] || 0;
        stack[key] = k + 1;
        el("path", {d: `M${x1},${top} L${x1},${ya} L${x2},${yb} L${x2},${top} Z`, fill: "rgba(227,116,0,0.07)", stroke: c, "stroke-dasharray": "3 2"});
        el("text", {x: (x1 + x2) / 2, y: Math.min(ya, yb) - 4 - 12 * k, "text-anchor": "middle", "font-size": 10, fill: c},
           null, `${e.case === "WU" ? "Wu" : e.case} ${f2(w1)}→${f2(w2)}`);
      }
    });
    el("text", {x: (xa + xb) / 2, y: yBeam + 40, "text-anchor": "middle", "font-size": 12, fill: "var(--ink)"},
       null, `ช่วง ${i + 1}: ${f2(s.L)} m • ${s.b}×${s.h} cm`);
    const hit = el("rect", {x: xa + 2, y: 8, width: Math.max(4, xb - xa - 4), height: yBeam + 25, class: "hit"});
    hit.addEventListener("click", (ev) => openSpan(i, ev));
  });
  el("line", {x1: sx(0), y1: yBeam, x2: sx(total), y2: yBeam, stroke: "#3c4043", "stroke-width": 6, "pointer-events": "none"});

  data.nodes.slice(0, data.spans.length + 1).forEach((n, j) => {
    const x = sx(X0[j]);
    const g = el("g", {class: "node"});
    const brk = j > 0 && j < data.spans.length && (data.allSimple || !n.cont);
    if (selected && selected[0] === "node" && selected[1] === j + 1)
      el("circle", {cx: x, cy: yBeam + 8, r: 18, fill: "none", stroke: "#f9ab00", "stroke-width": 2.5}, g);
    if (n.kind === "Pin") {
      el("path", {d: `M${x},${yBeam + 3} L${x - 11},${yBeam + 21} L${x + 11},${yBeam + 21} Z`, fill: "#f9ab00", stroke: "#3c4043"}, g);
      el("line", {x1: x - 15, y1: yBeam + 24, x2: x + 15, y2: yBeam + 24, stroke: "#3c4043", "stroke-width": 2}, g);
    } else if (n.kind === "Fixed") {
      el("rect", {x: x - 4, y: yBeam - 26, width: 8, height: 52, fill: "#5f6368"}, g);
      for (let k = 0; k < 5; k++) el("line", {x1: x - 4, y1: yBeam - 22 + k * 11, x2: x - 12, y2: yBeam - 14 + k * 11, stroke: "#5f6368"}, g);
    } else if (n.kind === "Column") {
      el("rect", {x: x - 6, y: yBeam + 3, width: 12, height: 26, fill: "#bdc1c6", stroke: "#5f6368"}, g);
      if (num(n.ub)) el("rect", {x: x - 6, y: yBeam - 60, width: 12, height: 57, fill: "rgba(189,193,198,0.35)", stroke: "#9aa0a6", "stroke-dasharray": "3 2"}, g);
    } else {
      el("circle", {cx: x, cy: yBeam, r: 5, fill: "#fff", stroke: "#9aa0a6", "stroke-width": 2}, g);
    }
    if (brk) el("circle", {cx: x, cy: yBeam, r: 6, fill: "#fff", stroke: "#3c4043", "stroke-width": 2}, g);
    el("text", {x: x, y: yBeam + 58, "text-anchor": "middle", "font-size": 11, fill: "var(--muted)"}, g,
       `${j + 1} ${n.kind}${brk ? " (ตัด)" : ""}`);
    el("rect", {x: x - 18, y: yBeam - 30, width: 36, height: 95, fill: "rgba(0,0,0,0)"}, g);
    g.addEventListener("click", (ev) => openNode(j, ev));
  });
}

function closePop() { if (pop) { pop.remove(); pop = null; } selected = null; draw(); }

function place(div, ev) {
  const wrap = document.getElementById("wrap");
  wrap.appendChild(div);
  const r = wrap.getBoundingClientRect();
  let left = ev.clientX - r.left + 10, topY = 20;
  if (left + div.offsetWidth > r.width - 4) left = Math.max(4, r.width - div.offsetWidth - 4);
  div.style.left = left + "px"; div.style.top = topY + "px";
}

function field(label, id, value, type) {
  return `<label for="${id}">${label}</label><input id="${id}" type="${type || "number"}" step="any" value="${value ?? ""}">`;
}

const esc = (v) => String(v ?? "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");

function itemCard(it) {
  const div = document.createElement("div");
  div.className = "item";
  const opts = (list, v) => list.map(o => `<option ${o === v ? "selected" : ""}>${esc(o)}</option>`).join("");
  const inp = (cls, label, v, ph) =>
    `<label>${label}</label><input type="text" class="${cls}" value="${esc(v)}" placeholder="${ph || ""}">`;
  const render = () => {
    const kind = div.querySelector(".kind").value;
    const g = div.querySelector(".geo");
    const unit = kind === data.point ? data.fu : (kind === data.slab || kind.startsWith("ผนัง") ? "kg/m²" : data.wu);
    let h = "";
    if (kind === data.slab) {
      h = `<div class="row">${inp("S", "พื้น S", it.S, "m")}${inp("L", "× L", it.L, "m")}${inp("t", "หนา", it.t, "cm")}
           <label>แบบ</label><select class="type">${opts(data.slabTypes, it.type || "อัตโนมัติ")}</select>
           <label>คานอยู่</label><select class="side">${opts(data.sides, it.side || "อัตโนมัติ")}</select></div>
           <div class="row">${inp("DL", "SDL", it.DL, "kg/m²")}${inp("LL", "LL", it.LL, "kg/m²")}${inp("WU", "Wu", it.WU, "kg/m²")}</div>`;
    } else {
      h = `<div class="row">${kind.startsWith("ผนัง") ? inp("S", "สูง/กว้าง S", it.S, "m") : ""}
           ${inp("DL", "DL", it.DL, unit)}${inp("LL", "LL", it.LL, unit)}${inp("WU", "Wu", it.WU, unit)}</div>
           <div class="row">${inp("a", kind === data.point ? "ที่ a" : "a", it.a, "m")}
           ${kind === data.point ? "" : inp("b", "b", it.b, "L")}</div>`;
    }
    g.innerHTML = h;
  };
  div.innerHTML = `<div class="row"><input type="text" class="nm" value="${esc(it.name)}" placeholder="ชื่อรายการ">
      <select class="kind">${opts(data.kinds, it.kind || data.slab)}</select>
      <button class="del" title="ลบรายการ">✕</button></div><div class="geo"></div>
      <div class="res ${it.err ? "err" : ""}">${it.res ? `ได้: DL ${it.res.DL || "-"} • LL ${it.res.LL || "-"} • Wu ${it.res.WU || "-"}` : ""}${it.note ? " — " + esc(it.note) : ""}</div>`;
  div.querySelector(".kind").onchange = () => { it = collect(div); render(); };
  div.querySelector(".del").onclick = () => div.remove();
  render();
  return div;
}

function collect(div) {
  const v = (c) => { const e = div.querySelector("." + c); return e ? e.value : ""; };
  return {name: v("nm"), kind: v("kind"), S: v("S"), L: v("L"), t: v("t"), type: v("type"), side: v("side"),
          DL: v("DL"), LL: v("LL"), WU: v("WU"), a: v("a"), b: v("b")};
}

function openSpan(i, ev) {
  if (pop) pop.remove();
  selected = ["span", i + 1]; draw();
  const s = data.spans[i];
  const div = document.createElement("div");
  div.className = "pop wide";
  div.innerHTML = `<h4>ช่วงที่ ${i + 1}</h4>
    <div class="row">${field("ชื่อคาน", "nm", s.name, "text")}${field("L (m)", "L", s.L)}
      ${field("b (cm)", "b", s.b)}${field("h (cm)", "h", s.h)}</div>
    <div style="margin-top:6px;color:var(--muted)">รายการน้ำหนักใต้คานช่วงนี้ — เพิ่มได้ไม่จำกัด • พิมพ์สูตรได้ทุกช่อง เช่น 2400*0.12+150 •
      DL/LL = ใช้งาน (โปรแกรมคูณให้), Wu = ประลัยที่คูณแล้ว • น้ำหนักคานคิดให้อัตโนมัติ</div>
    <div class="items"></div>
    <button class="link" id="addSlab">+ พื้น</button><button class="link" id="addWall">+ ผนัง</button>
    <button class="link" id="addPoint">+ แรงจุด</button><button class="link" id="addLine">+ น้ำหนักแผ่</button>
    <div class="btns"><button id="cancel">ยกเลิก</button><button class="primary" id="ok">ตกลง</button></div>`;
  const box = div.querySelector(".items");
  data.items.filter(it => Number(it.span) === i + 1).forEach(it => box.appendChild(itemCard(it)));
  const add = (kind, extra) => box.appendChild(itemCard(Object.assign({kind: kind}, extra || {})));
  div.querySelector("#addSlab").onclick = () => add(data.slab, {t: "12", DL: "150", LL: "200"});
  div.querySelector("#addWall").onclick = () => add(data.kinds.find(k => k.startsWith("ผนัง")), {name: "ผนัง", S: "3", DL: "180"});
  div.querySelector("#addPoint").onclick = () => add(data.point, {a: f2(s.L / 2)});
  div.querySelector("#addLine").onclick = () => add(data.kinds.find(k => k.startsWith("น้ำหนักแผ่")));
  div.querySelector("#cancel").onclick = closePop;
  div.querySelector("#ok").onclick = () => {
    const g = (id) => div.querySelector("#" + id).value;
    const items = [...box.querySelectorAll(".item")].map(collect);
    setValue({type: "span", index: i + 1, nonce: Date.now() + Math.random(),
              span: {name: g("nm"), L: num(g("L")), b: num(g("b")), h: num(g("h"))}, items: items});
    if (pop) { pop.remove(); pop = null; }
  };
  pop = div; place(div, ev);
}

function openNode(j, ev) {
  if (pop) pop.remove();
  selected = ["node", j + 1]; draw();
  const n = data.nodes[j];
  const kinds = ["Pin", "Fixed", "Free", "Column"].map(k => `<option ${n.kind === k ? "selected" : ""}>${k}</option>`).join("");
  const div = document.createElement("div");
  div.className = "pop";
  div.innerHTML = `<h4>จุดรองรับที่ ${j + 1}</h4>
    <div class="row"><label>ชนิด</label><select id="kind" style="width:100px">${kinds}</select>
      ${field("c (cm)", "c", n.c)}</div>
    <div class="row"><label>เสาล่าง</label>${field("b", "lb", n.lb)}${field("h", "lh", n.lh)}${field("H (m)", "lH", n.lH)}</div>
    <div class="row"><label>เสาบน</label>${field("b", "ub", n.ub)}${field("h", "uh", n.uh)}${field("H (m)", "uH", n.uH)}</div>
    <div class="row"><label><input type="checkbox" id="cont" ${n.cont ? "checked" : ""}> คานต่อเนื่องผ่านจุดนี้</label></div>
    <div style="color:var(--muted);font-size:12px">ติ๊ก = คานต่อเนื่อง • ไม่ติ๊ก = ตัดโมเมนต์ เป็นคานเดี่ยวต่อกัน
      (Pin อย่างเดียวยังเป็นคานต่อเนื่อง)<br>Pin = หมุนได้ • Fixed = ยึดแน่น • Free = ปลายยื่น • Column = คิด stiffness เสา 4EI/H</div>
    <div class="btns"><button id="cancel">ยกเลิก</button><button class="primary" id="ok">ตกลง</button></div>`;
  div.querySelector("#cancel").onclick = closePop;
  div.querySelector("#ok").onclick = () => {
    const g = (id) => num(div.querySelector("#" + id).value);
    setValue({type: "node", index: j + 1, nonce: Date.now() + Math.random(),
              node: {kind: div.querySelector("#kind").value, c: g("c"), lb: g("lb"), lh: g("lh"), lH: g("lH"),
                     ub: g("ub"), uh: g("uh"), uH: g("uH"), cont: div.querySelector("#cont").checked}});
    if (pop) { pop.remove(); pop = null; }
  };
  pop = div; place(div, ev);
}

window.addEventListener("resize", () => { if (data) draw(); });
</script>
</body>
</html>
